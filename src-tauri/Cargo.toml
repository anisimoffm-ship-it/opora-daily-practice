[package]
name = "opora"
version = "0.1.0"
description = "Opora desktop app"
authors = ["Opora"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "mental_health_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
